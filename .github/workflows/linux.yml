# ─────────────────────────────────────────────────────────────────
# linux.yml — Runs certificate tests on Linux (Ubuntu) ONLY
# ─────────────────────────────────────────────────────────────────
# Triggered by:
#   1. Push to ci/linux branch
#   2. Pull request targeting ci/linux
#   3. Manual trigger from GitHub Actions UI
#   4. Called directly by all_platforms.yml (workflow_call)
# ─────────────────────────────────────────────────────────────────

name: "CI — Linux"

on:
  push:
    branches: [ ci/linux ]
  pull_request:
    branches: [ ci/linux ]
  workflow_dispatch:
  # workflow_call makes this reusable — all_platforms.yml can call it directly
  workflow_call:

jobs:
  test-linux:
    name: "Linux — Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OpenSSL (Linux)
        run: sudo apt-get update && sudo apt-get install -y openssl
      - name: Verify OpenSSL
        run: openssl version
      - name: Install dependencies
        run: pip install pytest cryptography pytest-html
      - name: Run certificate tests
        run: >
          pytest test_certs.py -v
          --tb=short
          --html=report-linux-py${{ matrix.python-version }}.html
          --self-contained-html
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-linux-py${{ matrix.python-version }}
          path: report-linux-py${{ matrix.python-version }}.html
          retention-days: 30