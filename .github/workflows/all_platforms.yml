# ─────────────────────────────────────────────────────────────────
# all_platforms.yml — Master Pipeline
# ─────────────────────────────────────────────────────────────────
# This is the master pipeline. Instead of duplicating steps, it
# calls each platform's individual workflow directly using
# GitHub's workflow_call feature.
#
# HOW TO ADD A NEW PLATFORM:
#   1. Create your new workflow file (e.g. .github/workflows/myplatform.yml)
#   2. Add 'workflow_call:' to its 'on:' trigger section
#   3. Add a new job below following the same pattern as the others
#   4. That's it — the new platform will run as part of this pipeline
#
# Current platforms called:
#   - macos.yml       → macOS latest
#   - windows.yml     → Windows latest
#   - linux.yml       → Ubuntu latest
#   - mobile.yml      → Mobile device emulation (iPhone, Android, iPad)
# ─────────────────────────────────────────────────────────────────

name: "CI — All Platforms"

on:
  # Triggers on push to ci/all-platforms or main
  push:
    branches: [ ci/all-platforms, main ]
  # Triggers on pull requests targeting main
  pull_request:
    branches: [ main ]
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      # ── HOW TO ADD A PLATFORM VIA MANUAL TRIGGER ──────────────
      # When triggering manually from GitHub UI, you can choose
      # which platforms to run using the checkboxes below.
      # To add a new platform: add a new boolean input here AND
      # add a corresponding job below that checks this input.
      # ──────────────────────────────────────────────────────────
      run_macos:
        description: "Run macOS tests"
        type: boolean
        default: true
      run_windows:
        description: "Run Windows tests"
        type: boolean
        default: true
      run_linux:
        description: "Run Linux tests"
        type: boolean
        default: true
      run_mobile:
        description: "Run Mobile emulation tests"
        type: boolean
        default: true

# ── JOBS ─────────────────────────────────────────────────────────
# Each job calls one platform workflow using 'uses'.
# The format is: uses: ./.github/workflows/FILENAME.yml
# This means "call this workflow file from the same repo"
#
# 'if' conditions check:
#   - github.event_name != 'workflow_dispatch' means always run on push/PR
#   - inputs.run_X == true means run if manually selected in the UI
# This way push/PR always runs everything, but manual triggers are selective.
# ─────────────────────────────────────────────────────────────────
jobs:

  # ── macOS ───────────────────────────────────────────────────────
  # Calls macos.yml — runs on every push/PR, or when manually selected
  # TO ADD A NEW PLATFORM: copy this block and change the name/uses/input
  macos:
    name: "macOS Pipeline"
    if: github.event_name != 'workflow_dispatch' || inputs.run_macos == true
    uses: ./.github/workflows/macos.yml

  # ── Windows ─────────────────────────────────────────────────────
  windows:
    name: "Windows Pipeline"
    if: github.event_name != 'workflow_dispatch' || inputs.run_windows == true
    uses: ./.github/workflows/windows.yml

  # ── Linux ───────────────────────────────────────────────────────
  linux:
    name: "Linux Pipeline"
    if: github.event_name != 'workflow_dispatch' || inputs.run_linux == true
    uses: ./.github/workflows/linux.yml

  # ── Mobile ──────────────────────────────────────────────────────
  mobile:
    name: "Mobile Pipeline"
    if: github.event_name != 'workflow_dispatch' || inputs.run_mobile == true
    uses: ./.github/workflows/mobile.yml

  # ── Summary ─────────────────────────────────────────────────────
  # Runs after ALL platform jobs finish and prints a status summary.
  # 'needs' lists every job above — this job waits for all of them.
  # if: always() means this runs even if some platform jobs failed.
  #
  # TO ADD A NEW PLATFORM: add its job name to the 'needs' list below
  summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [ macos, windows, linux, mobile ]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "============================================"
          echo "  Keyfactor Lab — All Platforms Complete"
          echo "============================================"
          echo "  Platforms run:"
          echo "    macOS   : ${{ needs.macos.result }}"
          echo "    Windows : ${{ needs.windows.result }}"
          echo "    Linux   : ${{ needs.linux.result }}"
          echo "    Mobile  : ${{ needs.mobile.result }}"
          echo "============================================"
          echo ""
          echo "  Download HTML reports from the"
          echo "  Artifacts section of each pipeline run."
          echo "============================================"