# ─────────────────────────────────────────────────────────────────
# windows.yml — Runs certificate tests on Windows ONLY
# ─────────────────────────────────────────────────────────────────
# Triggered by:
#   1. Push to ci/windows branch
#   2. Pull request targeting ci/windows
#   3. Manual trigger from GitHub Actions UI
#   4. Called directly by all_platforms.yml (workflow_call)
# ─────────────────────────────────────────────────────────────────

name: "CI — Windows"

on:
  push:
    branches: [ ci/windows ]
  pull_request:
    branches: [ ci/windows ]
  workflow_dispatch:
  # workflow_call makes this reusable — all_platforms.yml can call it directly
  workflow_call:

jobs:
  test-windows:
    name: "Windows — Python ${{ matrix.python-version }}"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OpenSSL (Windows)
        run: choco install openssl -y
      - name: Verify OpenSSL
        shell: bash
        run: openssl version
      - name: Install dependencies
        run: pip install pytest cryptography pytest-html
      - name: Run certificate tests
        shell: bash
        run: >
          pytest test_certs.py -v
          --tb=short
          --html=report-windows-py${{ matrix.python-version }}.html
          --self-contained-html
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-windows-py${{ matrix.python-version }}
          path: report-windows-py${{ matrix.python-version }}.html
          retention-days: 30